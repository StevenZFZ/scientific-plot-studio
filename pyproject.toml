[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-plot-studio"
version = "0.14.0"
description = "Editable, auditable scientific plotting desktop MVP"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "matplotlib>=3.9,<4", "numpy>=2,<3", "Pillow>=11,<14", "pypdf>=5,<7", "olefile>=0.47,<1", "python-pptx>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dataframe = ["pandas>=2.2,<4"]

[project.scripts]
sps = "sps.__main__:main"

[tool.setuptools.packages.find]
include = ["sps*"]

[tool.setuptools.package-data]
sps = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
